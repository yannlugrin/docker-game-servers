# CI — this repository's own harness, run on the forge.
#
# It restates no check: it installs the pinned toolchain with the documented
# `just setup` and calls the same entry points a developer calls, so CI and a
# local run cannot disagree about what "green" means. Every run is a clean
# checkout doing that setup in full, which is also how a fresh setup is
# proven. Shape and trade-offs: DECISIONS.md D-014, D-015.
#
# There is deliberately no `schedule:` (root §2.8). The schedules root §8
# requires arrive with the steps that build them (`step-010`, `step-011`); a
# keep-alive schedule invented now would be a scheduled workflow with no job
# to do, on the same disable-on-idle clock.

name: CI

on:
  push:
    # Narrowed to the default branch so a pull request from a branch of this
    # repository gets one run, not two.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reads the repository and nothing else. Publication arrives at `step-006`,
# which asks for the token scope it needs in its own workflow file.
permissions:
  contents: read

# One run per ref. A pull request supersedes its own earlier runs — the older
# commit's result is about to be irrelevant, and letting it finish costs
# minutes to answer a question nobody will ask.
#
# `main` is exempt deliberately: cancelling there would leave commits on the
# default branch with no recorded result, and the default branch is where
# "has this been proven" is asked — of a tagged step close, and of the
# schedules root §8 adds at `step-010` and `step-011`. D-014.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # `just` is the runner that invokes the setup command, so it cannot be
  # installed by it, and no runner image ships it. Fetched from the just
  # project's own release, pinned by version *and* by the SHA-256 that
  # release publishes — release assets are mutable under a fixed tag, and
  # this file gains publish credentials at `step-006`. Both values move
  # together; JUST_SHA256 is that release's x86_64-unknown-linux-musl line.
  # Keep in step with `.claude/docs/environment.md` §1. D-015.
  JUST_VERSION: "1.45.0"
  # The pragma is for detect-secrets, which cannot tell a published checksum
  # from a credential.
  JUST_SHA256: "dc3f958aaf8c6506dd90426e9b03f86dd15e74a6467ee0e54929f750af3d9e49" # pragma: allowlist secret

jobs:
  # One job definition, two gates. `just check` and `just test` differ in
  # exactly one step, and a matrix is what keeps the shared half from
  # drifting into two ideas of a fresh install.
  harness:
    name: just ${{ matrix.entrypoint }}
    # Pinned rather than `ubuntu-latest`: §2.1 makes this project amd64-only,
    # and a runner image moving under a floating label is the one variable a
    # checksum cannot pin.
    runs-on: ubuntu-24.04
    strategy:
      # Both gates always report. A failing `check` that cancels `test` hides
      # half of what the run was asked to tell us.
      fail-fast: false
      matrix:
        entrypoint: [check, test]
    steps:
      - name: Check out the repository
        # `just check` enumerates from git, so this must be a real repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Bash guard needs `PurePath.full_match`, which is Python 3.13+;
      # `ubuntu-24.04` ships 3.12.3, and the first CI run died on exactly
      # that. Pinned to this machine's version so the guard, the venv and
      # every `language: python` hook meet the interpreter they were measured
      # against. D-014.
      - name: Install Python, matched to the development machine
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install just, verified against its published checksum
        run: |
          set -euo pipefail
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
          curl --silent --show-error --location --fail --output "${archive}" "${url}"
          echo "${JUST_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          tar --extract --file "${archive}" --directory "${HOME}/.local/bin" just
          rm "${archive}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # Uncached, deliberately: a cold setup measures 37 s against 474 MB of
      # hook environments, so a cache round-trip is at best break-even. D-014.
      - name: Install the toolchain — the documented setup command, in full
        run: just setup

      - name: just ${{ matrix.entrypoint }}
        run: just ${{ matrix.entrypoint }}
