# The rule-2 checks, run on GitHub exactly as they run locally: the same
# `make setup`, `make check`, `make test`. Nothing here builds or publishes an
# image — image CI arrives with its own workflows (root spec 8).
---
name: harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly uncached run: proves the documented setup command still works from
  # nothing (a pin that rotted, a wheel that vanished). Scheduled triggers in a
  # public repository are disabled after ~60 days of inactivity (root spec
  # 2.8) — the in-repo staleness check that makes that loud arrives with the
  # scheduled refresh (step-007), and covers this trigger too.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: make setup
      - run: make check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: make setup
      - run: make test

  fresh-setup:
    name: verify (uncached)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make verify
