# The single declaration of what "well-formed" means in this repository.
#
# `just check` runs these hooks over an explicit file list, and the git
# commit hook runs the same ones over what is staged, so the two runners
# cannot drift apart into different ideas of green.
#
# Nothing here rewrites a file. A failing check must report, never mutate —
# the specifications are read-only under rule 1, and a check that edits them
# is a rule violation performed by the harness itself. The two repairing
# hooks worth having (trailing whitespace, final newline) are `step-001`'s
# decision, because that step owes a `.claude/docs/` note for any hook that
# rewrites.

# Two standing path exclusions, keyed on the path and not on tracked status:
# `.claude/spec-work/` is no session's reading material, and `.claude/refs/`
# is operator-supplied material owned elsewhere — not this repository's
# product to lint.
exclude: ^\.claude/(spec-work|refs)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --- Well-formedness, one family per artifact class present today ---
      # Check families arrive with the first file of their class, never
      # ahead of it (rule 2). A green run therefore says nothing about
      # artifact classes this repository does not yet contain.

      # `.claude/settings.json` is the permission enforcement mechanism
      # itself: malformed, it fails as quietly as a hook that never runs.
      - id: check-json
      - id: check-yaml

      # --- Repository hygiene: guards whose value is retroactive ---
      # These are not artifact-class families. They earn their place on
      # blast radius instead: each one guards a mistake that cannot be
      # undone once committed, so the guard has to predate the risk.

      # The `pz` track downloads multi-gigabyte game content. A blob in git
      # history is unrecoverable without rewriting history — which rule 9
      # protects — so this must be in place before the first download, not
      # alongside it. `--enforce-all` checks every file it is handed rather
      # than only the newly added ones, which is what makes it see the
      # untracked files `just check` deliberately passes in.
      - id: check-added-large-files
        args: [--enforce-all]

      # `step-002`'s guard names a lost `+x` as one of its silent deaths,
      # and every game entrypoint after it has the same failure mode: a
      # script that is executable without a shebang, or carries a shebang
      # without being executable, fails at runtime and nowhere earlier.
      #
      # Measured, because the two differ: the first reads the filesystem
      # mode and so sees untracked files, while the second reads the *git
      # index* filemode (deliberately, so it also works on Windows) and
      # therefore only ever fires on tracked files — at commit time, which
      # is when it matters.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

      # A conflict marker committed into an entrypoint is a runtime break.
      - id: check-merge-conflict
      # This repository is developed on WSL2 and consumed on case-sensitive
      # filesystems; a case collision is invisible on one and fatal on the
      # other.
      - id: check-case-conflict
      # Nothing here vendors another repository, and a submodule added by
      # accident breaks every clone that does not know to recurse.
      - id: forbid-submodules
      # Measured: this hook flags a file carrying *more than one* ending
      # style — a half-converted file — and passes a uniformly-CRLF one.
      # Enforcing LF everywhere is `.gitattributes`' job, and that file
      # explains why the pair is needed. `--fix=no` keeps this a report
      # rather than a rewrite.
      - id: mixed-line-ending
        args: [--fix=no]

      # --- Secrets: rule 5, mechanically ---
      # Rule 5 says a secret never enters the repository — not in files, not
      # in examples with real values, not in commit messages — and it is the
      # one rule whose violation cannot be undone by a later commit.
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Chosen over gitleaks for a design reason, not a quality one: this
      # hook takes filenames, so it sees the untracked files `just check`
      # passes it. gitleaks' hook scans the staged git diff instead, which
      # would fit the commit hook and silently skip a secret sitting
      # uncommitted in the working tree — the case that matters most.
      #
      # Deliberately run with no `.secrets.baseline`: a baseline is an
      # allowlist for known false positives, and there are none yet.
      # Introduce one at the moment a real false positive appears, rather
      # than maintaining a file of hashes in anticipation (rule 11).
      - id: detect-secrets

  # --- The documents themselves ---
  # In this repository documents are load-bearing: the specifications are
  # the sole source of requirements, the plans are the current-state record,
  # and `CLAUDE.md` is the standing instruction set. They are linted like
  # code. Both hooks below report; neither rewrites.

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      # `--config` is explicit because pymarkdown 0.9.39 does not
      # auto-discover `.pymarkdown.yaml` — measured, and a config silently
      # not read is the same failure as a linter that never runs.
      # `--strict-config` turns a mistyped key in that file into an error
      # rather than a setting that quietly does nothing. `scan` restores the
      # hook's own default argument, which naming `args` replaces.
      - id: pymarkdown
        args: [--strict-config, --config, .pymarkdown.yaml, scan]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      # Spelling over every text file, not only the markdown ones, so a typo
      # in a comment is caught alongside one in a document.
      #
      # One allowed word, and it is the read-only rule at work: `unparseable`
      # is a standard variant spelling that codespell prefers to write
      # `unparsable`, and root §3.4 uses it. The specification cannot be
      # edited to satisfy a linter, so the linter yields — and the plans that
      # quote the specification's wording stay consistent with it. D-009.
      - id: codespell
        args: [--ignore-words-list=unparseable]

  # --- Python, arriving with the repository's first Python files ---
  # `.claude/hooks/bash_guard.py` and `scripts/`. Lint only: `ruff-format` is
  # deliberately absent on two grounds — it rewrites, which nothing here does,
  # and the guard is a vendored file whose docstring asks not to be reflowed,
  # so formatting it would make every template refresh a diff against our
  # reformatting rather than against the template. Measured: the guard passes
  # `ruff check` untouched, and ruff's default line length is 88, which is the
  # width that file documents — so the exemption its docstring anticipates is
  # not needed here, and no `force-exclude` with it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      # Is the guard alive? Structure and contract, no behaviour cases — the
      # behaviour lives in `just test`. This runs on every commit rather than
      # only when the guard changes, because the deaths it exists to catch
      # include a **rename**: keyed on the file's own path, the check would be
      # skipped by the very commit that broke it. Measured at 0.03 s.
      - id: bash-guard-liveness
        name: the Bash guard is alive
        entry: .claude/hooks/bash_guard.py --liveness
        language: system
        pass_filenames: false
        always_run: true

      # Does every declared hook command name a file that is actually there?
      # Valid JSON, a settings file that loads and a green lint all survive a
      # path that resolves to nothing — and the guard never runs. Always-run
      # for the same reason as above. Measured at 0.01 s.
      - id: settings-hooks-resolve
        name: declared hook commands resolve
        entry: scripts/check_settings_hooks.py
        language: system
        pass_filenames: false
        always_run: true

      # Governance frontmatter, arriving with the first files of its class
      # (`.claude/agents/`). A malformed agent does not error — it silently
      # never loads, and the ritual that names it then skips a step and
      # reports success. Always-run for the same reason as the two above: a
      # deletion or a rename is one of the failures, and a path-keyed hook
      # would not see it. There is no standard tool for this shape, which is
      # what sanctions the few lines of custom check.
      - id: agent-frontmatter
        name: agent definitions are well-formed
        entry: scripts/check_agent_frontmatter.py
        language: system
        pass_filenames: false
        always_run: true

      # The justfile is the harness's own entry point, and `just` is the
      # only tool that can parse it. `--fmt --check` reports both a syntax
      # error and a formatting drift without rewriting the file.
      - id: just-fmt-check
        name: justfile parses and is canonically formatted
        entry: just --fmt --check
        language: system
        files: ^justfile$
        pass_filenames: false
