# The single declaration of what "well-formed" means here. `just check` and
# the commit hook both run these, so the two cannot disagree about green.
# Nothing rewrites a file — rule 1's specifications are read-only.
# Reasoning: DECISIONS.md D-007 (scope), D-008, D-009, D-013, D-016, D-017.

# `.claude/spec-work/` is no session's reading material; `.claude/refs/` is
# operator-supplied material this repository does not own.
exclude: ^\.claude/(spec-work|refs)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml

      # `--enforce-all` checks every file handed in, not only added ones,
      # which is what makes it see the untracked files `just check` passes.
      - id: check-added-large-files
        args: [--enforce-all]

      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules

      # `--fix=no`: report, never rewrite. LF enforcement is .gitattributes'.
      - id: mixed-line-ending
        args: [--fix=no]

      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Takes filenames, so it sees untracked files; gitleaks' hook scans the
      # staged diff and would miss a secret sitting in the working tree.
      # No baseline: false positives are annotated inline. D-017.
      - id: detect-secrets

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      # `--config` is explicit: 0.9.39 does not auto-discover the file.
      # `scan` restores the hook's default argument, which `args` replaces.
      - id: pymarkdown
        args: [--strict-config, --config, .pymarkdown.yaml, scan]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      # `unparseable` is used by root §3.4, which cannot be edited. D-009.
      - id: codespell
        args: [--ignore-words-list=unparseable]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Ambient shellcheck/pyflakes off: runners ship them, this machine does
      # not, and CI must not be stricter than a local run. D-016.
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Lint only; `ruff-format` rewrites, and would reflow the vendored guard.
      - id: ruff-check

  # Local hooks are `always_run` because a rename or deletion is one of the
  # failures they catch, and a path-keyed hook is skipped by the very commit
  # that breaks it.
  - repo: local
    hooks:
      - id: bash-guard-liveness
        name: the Bash guard is alive
        entry: .claude/hooks/bash_guard.py --liveness
        language: system
        pass_filenames: false
        always_run: true

      # A declared hook command whose path resolves to nothing never runs,
      # and nothing else notices.
      - id: settings-hooks-resolve
        name: declared hook commands resolve
        entry: scripts/check_settings_hooks.py
        language: system
        pass_filenames: false
        always_run: true

      # A malformed agent or skill does not error — it silently never loads.
      # `language: python` pins the parser; under `system` the import would
      # resolve from the ambient PATH and fail on a fresh clone.
      - id: agent-frontmatter
        name: agent and skill definitions are well-formed
        entry: scripts/check_agent_frontmatter.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        always_run: true

      # Renumbering a section breaks pointers in files the commit does not
      # touch. D-013.
      - id: section-references
        name: section pointers name the section they point at
        entry: scripts/check_section_references.py
        language: system
        pass_filenames: false
        always_run: true

      # `--fmt --check` reports a syntax error and formatting drift without
      # rewriting.
      - id: just-fmt-check
        name: justfile parses and is canonically formatted
        entry: just --fmt --check
        language: system
        files: ^justfile$
        pass_filenames: false
