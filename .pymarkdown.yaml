# PyMarkdown configuration for the governance documents.
#
# Root PLAN.md (step-000): the specifications and `.claude/refs/` are
# read-only, so this config bends to the documents as they already are.
# Every rule turned off below is a logged decision (root DECISIONS.md
# D-003), not a quiet config line.
plugins:
  # md013 line-length: the documents wrap prose at ~72 columns already,
  # but tables and reference links legitimately run long.
  md013:
    enabled: false
  # md001 heading-increment: every plan puts step headings at h3, so a
  # track with a single implicit milestone jumps h1 -> h3. Uniform step
  # heading depth across the three plans is worth more than the rule.
  md001:
    enabled: false
  # md036 emphasis-as-heading: the decision-log entry format is
  # `- **D-NNN - title**`, a bold lead-in inside a list item, not a
  # heading. The rule cannot tell the two apart.
  md036:
    enabled: false
