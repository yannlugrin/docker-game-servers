# yamllint configuration for the repository's YAML (workflows, compose
# examples). Run with --strict: warnings fail the check too.
---
extends: default

rules:
  document-start: disable
  # GitHub Actions keys (`on:`) are truthy-looking by design.
  truthy:
    check-keys: false
  line-length:
    max: 100
    allow-non-breakable-words: true
  comments:
    min-spaces-from-content: 1
